<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanMitra - Mobile Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .phone-container {
            position: relative;
            height: 100vh; /* Cover the whole screen from bottom to top */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .bezel-wrapper {
            position: relative;
            /* phonebazzle.png is a square canvas with a portrait phone centred inside it */
            height: 120vh;
            width: 120vh;
            flex: 0 0 auto;
        }

        .phone-bezel {
            height: 100%;
            width: auto;
            object-fit: contain;
            pointer-events: none;
            display: block;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            position: relative;
            z-index: 2;
        }

        .screen-container {
            position: absolute;
            /* Exact transparent screen aperture in the 4000 x 4000 bezel artwork */
            z-index: 1;
            top: 12.65%;
            bottom: 9.75%;
            left: 32.05%;
            right: 32.05%;
            border-radius: 9.5%;
            overflow: hidden;
            background: #f5f7f2;
        }

        .mobile-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Hide the phone bezel and go full screen on actual mobile devices */
        @media (max-width: 768px) {
            .phone-bezel {
                display: none;
            }
            .bezel-wrapper {
                height: 100vh;
                width: 100vw;
            }
            .screen-container {
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 0;
            }
            .back-btn {
                z-index: 100;
            }
        }

        .back-btn {
            position: fixed;
            z-index: 20;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Selection</a>

    <div class="phone-container">
        <div class="bezel-wrapper">
            <!-- The phone frame image -->
            <img src="phonebazzle.png" alt="Phone Bezel" class="phone-bezel" id="bezelImage">
            
            <!-- The container restricted to the screen area -->
            <div class="screen-container">
                <!-- The standalone mobile UI is deliberately contained inside this phone screen. -->
                <iframe src="mobile-ui/index.html" class="mobile-iframe" title="KisanMitra Mobile App"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
