<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanMitra - Mobile Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a1a1a;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .phone-container {
            position: relative;
            height: 100vh; /* Cover the whole screen from bottom to top */
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .bezel-wrapper {
            position: relative;
            height: 120vh; /* Scale up beyond 100vh to compensate for transparent padding in the image */
            display: inline-block;
        }

        .phone-bezel {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
        }

        .screen-container {
            position: absolute;
            z-index: 5;
            background-color: transparent; /* Empty phone for now */
            
            /* Tweak these percentages to perfectly align with the screen area of phonebazzle.png */
            top: 4.5%;
            bottom: 4.5%;
            left: 5.5%;
            right: 5.5%;
            
            border-radius: 35px;
            overflow: hidden;
        }

        .mobile-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Hide the phone bezel and go full screen on actual mobile devices */
        @media (max-width: 768px) {
            .phone-bezel {
                display: none;
            }
            .bezel-wrapper {
                height: 100vh;
                width: 100vw;
            }
            .screen-container {
                top: 0;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 0;
            }
            .back-btn {
                z-index: 100;
            }
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">← Back to Selection</a>

    <div class="phone-container">
        <div class="bezel-wrapper">
            <!-- The phone frame image -->
            <img src="phonebazzle.png" alt="Phone Bezel" class="phone-bezel" id="bezelImage">
            
            <!-- The container restricted to the screen area -->
            <div class="screen-container">
                <!-- All further mobile development loads inside this iframe -->
                <!-- The user requested the phone to be empty for now -->
                <iframe src="" class="mobile-iframe" title="Mobile App Screen"></iframe>
            </div>
        </div>
    </div>

</body>
</html>
